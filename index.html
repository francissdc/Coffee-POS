<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffee POS Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { font-family: "Inter", sans-serif; }
    .font-serif { font-family: "Playfair Display", serif; }
  </style>
</head>

<body class="bg-[#FAF7F2] text-[#3E2F23] overflow-hidden">
  <div class="flex h-screen w-screen overflow-hidden">
    <aside class="w-72 min-h-screen bg-gradient-to-b from-[#3B2416] to-[#24140D] border-r border-white/10 flex flex-col">
      <div class="flex-1">
        <div class="px-7 py-8 border-b border-white/10">
          <div class="flex items-center gap-4">
            <div class="w-14 h-14 rounded-2xl bg-[#D4A574] flex items-center justify-center shadow-lg">
              <i data-lucide="coffee" class="w-7 h-7 text-[#261C14]"></i>
            </div>
            <div>
              <h1 class="text-white text-3xl font-extrabold leading-none tracking-wide">Coffee Everyday</h1>
              <p class="text-[#C8A98B] text-sm tracking-[0.2em] uppercase mt-1">POS System</p>
            </div>
          </div>
        </div>

        <nav class="p-5 space-y-2">
          <button onclick="switchTab('menu')" id="nav-menu" class="sidebar-btn w-full flex items-center gap-4 px-5 py-4 rounded-2xl transition-all font-semibold text-[15px] bg-[#D4A574] text-[#261C14] shadow-lg">
            <i data-lucide="layout-grid" class="w-5 h-5"></i><span>Menu</span>
          </button>
          <button onclick="switchTab('orders')" id="nav-orders" class="sidebar-btn w-full flex items-center justify-between px-5 py-4 rounded-2xl transition-all font-medium text-[15px] text-[#C4B5A5] hover:bg-white/5 hover:text-white">
            <div class="flex items-center gap-4"><i data-lucide="zap" class="w-5 h-5"></i><span>Active Orders</span></div>
            <span id="active-orders-badge" class="text-sm font-bold hidden">0</span>
          </button>
          <button onclick="switchTab('history')" id="nav-history" class="sidebar-btn w-full flex items-center gap-4 px-5 py-4 rounded-2xl transition-all font-medium text-[15px] text-[#C4B5A5] hover:bg-white/5 hover:text-white">
            <i data-lucide="history" class="w-5 h-5"></i><span>Order History</span>
          </button>
        </nav>
      </div>

      <div class="border-t border-white/10 px-5 py-5 flex flex-col gap-3">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-2xl bg-[#6F4E37] flex items-center justify-center text-white font-bold text-lg border border-white/10" id="user-initials">U</div>
          <div>
            <h3 id="sidebar-admin-name" class="text-white font-semibold">User</h3>
            <p id="sidebar-cashier-name" class="text-[#C8A98B] text-sm mt-1">Role: Loading...</p>
          </div>
        </div>
        <button onclick="logoutUser()" class="w-full py-2 bg-white/10 hover:bg-white/20 text-white rounded-xl text-xs font-semibold transition-all">Sign Out</button>
      </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden relative">
      <header class="h-20 bg-white border-b border-[#E8E2D5] px-8 flex items-center justify-between flex-shrink-0 z-10">
        <div class="flex items-center gap-4 w-1/3">
          <div class="relative w-full" id="search-wrapper">
            <i data-lucide="search" class="w-4 h-4 text-[#A0826D] absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input type="text" id="search-input" placeholder="Search coffee or treats..." class="w-full pl-10 pr-4 py-2 rounded-xl bg-[#FAF7F2] border border-[#E8E2D5] focus:outline-none focus:border-[#D4A574] text-sm text-[#3E2F23]" />
          </div>
        </div>

        <div class="flex items-center gap-4">
          <div id="live-clock" class="text-sm font-medium text-[#7A6552] bg-[#FAF7F2] px-4 py-2 rounded-xl border border-[#E8E2D5]"></div>
          <button onclick="toggleCartPanel()" class="flex items-center gap-2 px-4 py-2 bg-[#3E2F23] hover:bg-[#5B4636] text-white rounded-xl shadow-md transition-all text-sm relative">
            <i data-lucide="shopping-cart" class="w-4 h-4"></i><span>Basket</span>
            <span id="cart-indicator-badge" class="absolute -top-1.5 -right-1.5 w-5 h-5 bg-[#E07A5F] text-white rounded-full text-[10px] flex items-center justify-center font-bold hidden">0</span>
          </button>
        </div>
      </header>

      <div class="flex-1 overflow-y-auto p-8 relative">
        <div id="edit-mode-container" class="flex justify-end mb-6 hidden">
          <button onclick="toggleEditMode()" class="px-5 py-2.5 rounded-xl bg-[#3E2F23] text-white text-sm font-bold hover:bg-[#5B4636] transition-all flex items-center gap-2">
            <i data-lucide="pencil" class="w-4 h-4"></i>Edit Menu
          </button>
        </div>

        <!--Menu-->
        <section id="view-menu" class="space-y-8">
          <div id="edit-mode-actions" class="hidden items-center justify-end gap-3 mb-4">
            <button onclick="discardMenuChanges()" class="px-5 py-2.5 rounded-xl border border-[#E8E2D5] bg-white text-[#E07A5F] font-semibold text-sm">Discard</button>
            <button onclick="saveMenuChanges()" class="px-5 py-2.5 rounded-xl bg-[#3E2F23] text-white font-semibold text-sm">Save Changes</button>
          </div>
          <div id="products-market-floor" class="space-y-12"></div>
        </section>

        <!--Active Orders-->
        <section id="view-orders" class="space-y-6 hidden">
          <h2 class="text-2xl font-bold font-serif border-b pb-4">Active Orders</h2>
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-white rounded-3xl border border-[#E8E2D5] p-6 shadow-sm">
              <h3 class="text-xl font-bold mb-4 text-[#E6A06A]">Preparing</h3>
              <div id="preparing-orders-grid" class="space-y-4"></div>
            </div>
            <div class="bg-white rounded-3xl border border-[#E8E2D5] p-6 shadow-sm">
              <h3 class="text-xl font-bold mb-4 text-emerald-700">Ready for Pickup</h3>
              <div id="ready-orders-grid" class="space-y-4"></div>
            </div>
          </div>
        </section>

        <!--Order History-->
        <section id="view-history" class="space-y-6 hidden">
          <div class="bg-white rounded-2xl border border-[#E8E2D5] p-6 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h2 class="text-xl font-bold font-serif">Order History & Sales</h2>
              <p class="text-xs text-[#7A6552] mt-1">Total Sales Today: <span id="daily-sales-total" class="font-bold text-emerald-700 text-sm">₱0.00</span></p>
            </div>
            <div id="manager-sales-controls" class="flex gap-2 hidden">
              <button onclick="printSalesSummary()" class="px-4 py-2 bg-[#3E2F23] hover:bg-[#5B4636] text-white text-xs font-bold rounded-xl transition-all">
                Print Sales Summary
              </button>
              <button id="clear-history-btn" onclick="clearOrderHistory()" class="px-4 py-2 bg-red-50 hover:bg-red-100 text-red-600 text-xs font-bold rounded-xl transition-all border border-red-200">
                Clear History
              </button>
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-[#E8E2D5] p-6 shadow-sm overflow-x-auto">
            <table class="w-full text-left text-sm border-collapse">
              <thead>
                <tr class="border-b border-[#E8E2D5] text-[#7A6552] text-xs uppercase bg-[#FAF7F2]">
                  <th class="p-4">ID</th><th class="p-4">Date & Time</th><th class="p-4">Customer</th><th class="p-4">Total</th><th class="p-4 text-right">Status</th>
                </tr>
              </thead>
              <tbody id="history-table-body"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!--Cart -->
  <div id="cart-backdrop" onclick="toggleCartPanel()" class="fixed inset-0 bg-black/40 z-40 hidden opacity-0 transition-all duration-300"></div>
  <aside id="cart-panel" class="fixed right-0 top-0 bottom-0 w-[420px] bg-white border-l border-[#E8E2D5] shadow-2xl z-50 flex flex-col justify-between translate-x-full transition-transform duration-300">
    <div class="p-6 border-b flex items-center justify-between bg-[#FAF7F2]">
      <h2 class="font-serif font-bold">Basket Summary</h2>
      <button onclick="toggleCartPanel()"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div id="cart-items-container" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
    <div class="p-6 border-t bg-[#FAF7F2] space-y-3">
      <input type="text" id="customer-name-field" placeholder="Customer Name..." class="w-full px-3.5 py-2.5 rounded-xl border border-[#E8E2D5] text-sm bg-white" />
      
      <div>
        <label class="block text-xs font-semibold text-[#7A6552] mb-1">Apply Discount (ID Type)</label>
        <select id="discount-select" onchange="renderBasketDom()" class="w-full px-3 py-2 rounded-xl border border-[#E8E2D5] text-xs bg-white">
          <option value="none">No Discount (Regular)</option>
          <option value="sc_pwd">Senior Citizen / PWD (20% Off)</option>
          <option value="student">Student ID (10% Off)</option>
        </select>
      </div>

      <div class="pt-2 border-t border-dashed space-y-1 text-xs">
        <div class="flex justify-between"><span>Subtotal</span><span id="price-summary-subtotal">₱0.00</span></div>
        <div class="flex justify-between text-emerald-700"><span>Discount</span><span id="price-summary-discount">-₱0.00</span></div>
        <div class="flex justify-between font-bold text-base pt-1"><span>Total</span><span id="price-summary-grand">₱0.00</span></div>
      </div>

      <button onclick="submitOrderTicket()" class="w-full py-3.5 rounded-xl bg-[#D4A574] text-white font-bold text-sm">Process Payment & Print</button>
    </div>
  </aside>

  <!--Receipt Modal -->
  <div id="receipt-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center hidden">
    <div class="bg-white w-full max-w-sm p-6 rounded-2xl shadow-2xl relative font-mono text-xs">
      <button onclick="closeReceiptModal()" class="absolute top-4 right-4"><i data-lucide="x" class="w-4 h-4"></i></button>
      <div id="receipt-modal-content" class="space-y-3"></div>
      <div class="mt-6 flex gap-2">
        <button onclick="window.print()" class="flex-1 py-2.5 bg-[#3E2F23] text-white rounded-xl font-bold">Print Receipt</button>
        <button onclick="closeReceiptModal()" class="flex-1 py-2.5 border border-[#3E2F23] rounded-xl font-bold">Close</button>
      </div>
    </div>
  </div>

  <!--Sales Summary-->
  <div id="sales-print-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center hidden">
    <div class="bg-white w-full max-w-sm p-6 rounded-2xl shadow-2xl relative font-mono text-xs">
      <button onclick="closeSalesModal()" class="absolute top-4 right-4"><i data-lucide="x" class="w-4 h-4"></i></button>
      <div id="sales-modal-content" class="space-y-3"></div>
      <div class="mt-6 flex gap-2">
        <button onclick="window.print()" class="flex-1 py-2.5 bg-[#3E2F23] text-white rounded-xl font-bold">Print Report</button>
        <button onclick="closeSalesModal()" class="flex-1 py-2.5 border border-[#3E2F23] rounded-xl font-bold">Close</button>
      </div>
    </div>
  </div>

  <div id="system-toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#3E2F23] text-white text-xs px-5 py-3 rounded-xl shadow-lg opacity-0 transition-all duration-300 pointer-events-none">
    <span id="system-toast-text"></span>
  </div>

  <script src="script.js"></script>
</body>
</html>
