<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Coffee Everyday</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FAF7F2] text-[#3E2F23] flex items-center justify-center h-screen">

  <div class="bg-white p-8 rounded-3xl border border-[#E8E2D5] shadow-xl w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold font-serif">Coffee Everyday</h1>
      <p class="text-xs text-[#7A6552] mt-1">Please sign in with your account role</p>
    </div>

    <form id="loginForm" class="space-y-5" novalidate>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wide text-[#7A6552] mb-2" for="username">Name / Role</label>
        <input type="text" id="username" placeholder="Enter 'manager' or 'staff'" class="w-full px-4 py-3 rounded-xl border border-[#E8E2D5] text-sm focus:outline-none focus:border-[#D4A574]" />
        <p id="usernameError" class="text-xs mt-1 text-red-500"></p>
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wide text-[#7A6552] mb-2" for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" class="w-full px-4 py-3 rounded-xl border border-[#E8E2D5] text-sm focus:outline-none focus:border-[#D4A574]" />
        <p id="passwordError" class="text-xs mt-1 text-red-500"></p>
      </div>

      <div class="flex items-center gap-2">
        <input type="checkbox" id="showPassword" class="rounded border-[#E8E2D5]" />
        <label for="showPassword" class="text-xs text-[#7A6552]">Show Password</label>
      </div>

      <button type="submit" class="w-full py-3.5 rounded-xl bg-[#3E2F23] text-white font-bold text-sm hover:bg-[#5B4636] transition-all">
        Sign In
      </button>

      <p id="formMessage" class="text-center text-xs mt-3 font-medium"></p>
    </form>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const usernameError = document.getElementById("usernameError");
    const passwordError = document.getElementById("passwordError");
    const showPassword = document.getElementById("showPassword");
    const formMessage = document.getElementById("formMessage");

    showPassword.addEventListener("change", () => {
      passwordInput.type = showPassword.checked ? "text" : "password";
    });

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      
      const nameVal = usernameInput.value.trim().toLowerCase();
      const passVal = passwordInput.value.trim();

      usernameError.textContent = "";
      passwordError.textContent = "";
      formMessage.textContent = "";

      if (nameVal === "") {
        usernameError.textContent = "Name is required.";
        return;
      }
      if (passVal === "") {
        passwordError.textContent = "Password is required.";
        return;
      }

      if (nameVal === "staff" && passVal === "staff123") {
        localStorage.setItem("userRole", "staff");
        localStorage.setItem("userName", "Staff");
        window.location.href = "index.html";
      } else if (nameVal === "manager" && passVal === "manager123") {
        localStorage.setItem("userRole", "manager");
        localStorage.setItem("userName", "Manager");
        window.location.href = "index.html";
      } else {
        formMessage.textContent = "Invalid name or password!";
        formMessage.className = "text-center text-xs mt-3 font-medium text-red-500";
      }
    });
  </script>
</body>
</html>
